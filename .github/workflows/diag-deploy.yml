name: Diag deploy reachability
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          case "$H" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|127.*)
              echo "ВЕРДИКТ: DEPLOY_HOST — приватный адрес, из интернета недостижим" ;;
            *) echo "ВЕРДИКТ: DEPLOY_HOST — публичный адрес" ;;
          esac
