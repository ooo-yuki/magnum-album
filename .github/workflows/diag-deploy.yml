name: Diag deploy reachability
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Проба 30640 с раннера и из контейнера
        env:
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in 1 2 3; do
            timeout 10 bash -c "echo > /dev/tcp/$H/30640" 2>/dev/null \
              && echo "раннер попытка $i: 30640 открыт" || echo "раннер попытка $i: 30640 ОТКАЗ"
          done
          docker run --rm alpine:3 sh -c "apk add -q --no-cache netcat-openbsd >/dev/null 2>&1; for i in 1 2 3; do nc -z -w8 $H 30640 && echo \"контейнер \$i: 30640 открыт\" || echo \"контейнер \$i: 30640 ОТКАЗ\"; done"
          docker run --rm alpine:3 sh -c "apk add -q --no-cache openssh-client >/dev/null 2>&1; ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p 30640 nobody@$H 2>&1 | head -2"
